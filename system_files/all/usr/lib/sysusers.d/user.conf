# Default interactive user baked into the image.
# Declared here so `bootc container lint` (sysusers check) stays clean and so
# systemd-sysusers (run by rpm triggers / first boot) stays consistent with
# the account created by base.sh at image build time.
# Home lives under /var (HOME=/var/home is the bootc base-image default).
u user 1000 "Paddlefish OS default user" /var/home/user /usr/bin/fish
m user wheel
