name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FEDORA_MAJOR_VERSION: "44"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: desktop
            base_image: ghcr.io/ublue-os/base-main:latest
            build_nvidia: "Y"
            build_desktop: "Y"
          - variant: laptop
            base_image: ghcr.io/ublue-os/base-main:latest
            build_nvidia: "N"
            build_desktop: "Y"
          - variant: server
            base_image: quay.io/fedora/fedora-bootc:44
            build_nvidia: "N"
            build_desktop: "N"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          podman build \
            --build-arg "FEDORA_MAJOR_VERSION=${{ env.FEDORA_MAJOR_VERSION }}" \
            --build-arg "BASE_IMAGE=${{ matrix.base_image }}" \
            --build-arg "IMAGE_NAME=${{ matrix.variant }}" \
            --build-arg "BUILD_NVIDIA=${{ matrix.build_nvidia }}" \
            --build-arg "BUILD_DESKTOP=${{ matrix.build_desktop }}" \
            -f Containerfile \
            -t "ghcr.io/${IMAGE_OWNER}/paddlefish-os-${{ matrix.variant }}:latest" \
            -t "ghcr.io/${IMAGE_OWNER}/paddlefish-os-${{ matrix.variant }}:${{ github.sha }}" \
            .

      - name: Push container image
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          podman push "ghcr.io/${IMAGE_OWNER}/paddlefish-os-${{ matrix.variant }}:latest"
          podman push "ghcr.io/${IMAGE_OWNER}/paddlefish-os-${{ matrix.variant }}:${{ github.sha }}"
